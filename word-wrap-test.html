<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSDF Word Wrap Test - Phase 5.1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: Arial, sans-serif;
            color: #ffffff;
        }
        #info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 5px;
            max-width: 300px;
            font-size: 12px;
            line-height: 1.5;
        }
        #info h3 {
            margin-top: 0;
            color: #00ff00;
        }
        #info code {
            background: #333;
            padding: 2px 4px;
            border-radius: 3px;
            color: #ffff00;
        }
        #game-container {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>Phase 5.1: Word Wrapping</h3>
        <p><strong>Controls:</strong></p>
        <ul>
            <li><code>↑</code> Increase maxWidth (+50px)</li>
            <li><code>↓</code> Decrease maxWidth (-50px)</li>
        </ul>
        <p><strong>Features:</strong></p>
        <ul>
            <li>Automatic word wrapping</li>
            <li>Works with all alignments</li>
            <li>Preserves existing newlines</li>
            <li>Detailed bounds with line info</li>
        </ul>
        <p>Check console for bounds data!</p>
    </div>
    <div id="game-container"></div>
    <script type="module" src="/examples/word-wrap-test.ts"></script>
</body>
</html>
