<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Single Character - MSDF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            overflow: hidden;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
        }

        #status {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            border: 1px solid #00ff00;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="status">Debug Mode</div>
    <div id="game-container"></div>

    <script type="module">
        import Phaser from 'phaser';
        import { DebugSingleChar } from './examples/debug-single-char.ts';

        const config = {
            type: Phaser.WEBGL,
            width: 1280,
            height: 720,
            parent: 'game-container',
            backgroundColor: '#1a1a2e',
            scene: [DebugSingleChar],
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH
            },
            render: {
                antialias: true,
                pixelArt: false
            }
        };

        const game = new Phaser.Game(config);
        window.game = game;
    </script>
</body>
</html>
