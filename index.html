<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phaser 4 MSDF Font — Examples</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0b0d12;
      --nav: #1a1f2b;
      --border: #2a3142;
      --fg: #e5e7eb;
      --muted: #8b93a5;
      --accent: #4ade80;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── Nav bar ─────────────────────────────────────────────── */
    #nav {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      height: 48px;
      background: var(--nav);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #nav button {
      background: #2a3142;
      border: none;
      color: var(--fg);
      height: 30px;
      min-width: 30px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    #nav button:hover:not(:disabled) { background: #3a4256; }
    #nav button:disabled { opacity: 0.35; cursor: default; }

    #nav-select {
      background: #2a3142;
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      height: 30px;
      padding: 0 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      min-width: 0;
      flex: 0 1 220px;
    }

    #nav-counter {
      font-size: 12px;
      color: var(--muted);
      margin-left: auto;
      flex-shrink: 0;
    }

    #btn-capture {
      padding: 0 10px;
      font-size: 12px;
      white-space: nowrap;
    }

    /* GitHub repo link — styled like a square icon button */
    #nav a#link-github {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      background: #2a3142;
      color: var(--fg);
      border-radius: 6px;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    #nav a#link-github:hover { background: #3a4256; }

    /* Mobile-only pane toggle */
    #btn-pane { display: none; padding: 0 10px; font-size: 12px; }

    /* ── Main area ───────────────────────────────────────────── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    #canvas-container {
      flex: 1;
      overflow: hidden;
      position: relative;
      min-width: 0;
    }
    #canvas-container canvas { display: block; }

    /* ── Tweakpane panel ─────────────────────────────────────── */
    #pane-container {
      width: 280px;
      flex-shrink: 0;
      background: var(--nav);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 8px;
    }
    #pane-container .tp-dfwv {
      width: 100% !important;
      box-shadow: none !important;
    }

    /* ── Mobile: pane becomes a collapsible overlay drawer ───── */
    @media (max-width: 760px) {
      #btn-pane { display: flex; }
      #nav-counter { display: none; }

      #pane-container {
        position: fixed;
        top: 48px;
        right: 0;
        bottom: 0;
        width: min(320px, 86vw);
        border-left: 1px solid var(--border);
        box-shadow: -8px 0 24px rgba(0, 0, 0, 0.45);
        transform: translateX(110%);
        transition: transform 0.22s ease;
        z-index: 20;
      }
      #pane-container.open { transform: translateX(0); }
    }
  </style>
</head>
<body>
  <nav id="nav">
    <button id="btn-prev" title="Previous (←)">&#8592;</button>
    <button id="btn-next" title="Next (→)">&#8594;</button>
    <select id="nav-select" title="Jump to example"></select>
    <span id="nav-counter"></span>
    <button id="btn-capture" title="Capture a WebGL frame with Spector.js">Spector.js Capture</button>
    <button id="btn-pane" title="Toggle controls">Controls</button>
    <a id="link-github" href="https://github.com/Antriel/phaser4-msdf-text"
       target="_blank" rel="noopener" title="View source on GitHub" aria-label="View source on GitHub">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
    </a>
  </nav>

  <div id="main">
    <div id="canvas-container"></div>
    <div id="pane-container"></div>
  </div>

  <script type="module" src="/examples/main.ts"></script>
</body>
</html>
