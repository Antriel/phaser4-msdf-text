<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phaser 4 MSDF Font — Examples</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0b0d12;
      --nav: #1a1f2b;
      --border: #2a3142;
      --fg: #e5e7eb;
      --muted: #8b93a5;
      --accent: #4ade80;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── Nav bar ─────────────────────────────────────────────── */
    #nav {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      height: 48px;
      background: var(--nav);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #nav button {
      background: #2a3142;
      border: none;
      color: var(--fg);
      height: 30px;
      min-width: 30px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    #nav button:hover:not(:disabled) { background: #3a4256; }
    #nav button:disabled { opacity: 0.35; cursor: default; }

    #nav-select {
      background: #2a3142;
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      height: 30px;
      padding: 0 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      min-width: 0;
      flex: 0 1 220px;
    }

    #nav-counter {
      font-size: 12px;
      color: var(--muted);
      margin-left: auto;
      flex-shrink: 0;
    }

    #btn-capture {
      padding: 0 10px;
      font-size: 12px;
      white-space: nowrap;
    }

    /* Mobile-only pane toggle */
    #btn-pane { display: none; padding: 0 10px; font-size: 12px; }

    /* ── Main area ───────────────────────────────────────────── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    #canvas-container {
      flex: 1;
      overflow: hidden;
      position: relative;
      min-width: 0;
    }
    #canvas-container canvas { display: block; }

    /* ── Tweakpane panel ─────────────────────────────────────── */
    #pane-container {
      width: 280px;
      flex-shrink: 0;
      background: var(--nav);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 8px;
    }
    #pane-container .tp-dfwv {
      width: 100% !important;
      box-shadow: none !important;
    }

    /* ── Mobile: pane becomes a collapsible overlay drawer ───── */
    @media (max-width: 760px) {
      #btn-pane { display: flex; }
      #nav-counter { display: none; }

      #pane-container {
        position: fixed;
        top: 48px;
        right: 0;
        bottom: 0;
        width: min(320px, 86vw);
        border-left: 1px solid var(--border);
        box-shadow: -8px 0 24px rgba(0, 0, 0, 0.45);
        transform: translateX(110%);
        transition: transform 0.22s ease;
        z-index: 20;
      }
      #pane-container.open { transform: translateX(0); }
    }
  </style>
</head>
<body>
  <nav id="nav">
    <button id="btn-prev" title="Previous (←)">&#8592;</button>
    <button id="btn-next" title="Next (→)">&#8594;</button>
    <select id="nav-select" title="Jump to example"></select>
    <span id="nav-counter"></span>
    <button id="btn-capture" title="Capture a WebGL frame with Spector.js">Capture frame</button>
    <button id="btn-pane" title="Toggle controls">Controls</button>
  </nav>

  <div id="main">
    <div id="canvas-container"></div>
    <div id="pane-container"></div>
  </div>

  <script type="module" src="/examples/main.ts"></script>
</body>
</html>
