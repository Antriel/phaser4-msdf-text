<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phaser 4 MSDF Font — Showcase</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111827;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── Nav bar ─────────────────────────────────────────────── */
    #nav {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      height: 44px;
      background: #1f2937;
      border-bottom: 1px solid #374151;
      flex-shrink: 0;
    }

    #nav button {
      background: #374151;
      border: none;
      color: #e5e7eb;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    #nav button:hover { background: #4b5563; }

    #nav-title {
      font-size: 14px;
      font-weight: 500;
      color: #f9fafb;
      min-width: 180px;
    }

    #nav-counter {
      font-size: 13px;
      color: #6b7280;
      margin-left: auto;
    }

    /* ── Main area ───────────────────────────────────────────── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #canvas-container {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #canvas-container canvas {
      display: block;
    }

    /* ── Tweakpane panel ─────────────────────────────────────── */
    #pane-container {
      width: 260px;
      flex-shrink: 0;
      background: #1f2937;
      border-left: 1px solid #374151;
      overflow-y: auto;
      display: none;
    }

    #pane-container.visible {
      display: block;
    }

    /* Make tweakpane fill the container and drop its own shadow */
    #pane-container .tp-dfwv {
      width: 100% !important;
      box-shadow: none !important;
    }
  </style>
</head>
<body>
  <nav id="nav">
    <button id="btn-prev">&#8592;</button>
    <button id="btn-next">&#8594;</button>
    <span id="nav-title">—</span>
    <span id="nav-counter"></span>
  </nav>

  <div id="main">
    <div id="canvas-container"></div>
    <div id="pane-container"></div>
  </div>

  <script type="module" src="/examples/showcase.ts"></script>
</body>
</html>
