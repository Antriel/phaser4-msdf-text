<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phaser 4 MSDF Font Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a2e;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
        }

        #game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 300px;
            z-index: 1000;
        }

        #info h2 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #4ecca3;
        }

        #info p {
            margin: 5px 0;
            line-height: 1.5;
        }

        .status {
            color: #4ecca3;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>Phaser 4 MSDF Test</h2>
        <p>Status: <span class="status" id="status">Loading...</span></p>
        <p>Phase: <span id="phase">Shader Testing</span></p>
    </div>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
