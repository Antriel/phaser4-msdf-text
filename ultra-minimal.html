<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Minimal - Raw Phaser API</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script type="module">
        import Phaser from 'phaser';
        import { UltraMinimal } from './examples/ultra-minimal.ts';

        const config = {
            type: Phaser.WEBGL,
            width: 1280,
            height: 720,
            parent: 'game-container',
            backgroundColor: '#000000',
            scene: [UltraMinimal],
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH
            }
        };

        const game = new Phaser.Game(config);
        window.game = game;
        console.log('Ultra minimal test - bypassing all helper functions');
    </script>
</body>
</html>
